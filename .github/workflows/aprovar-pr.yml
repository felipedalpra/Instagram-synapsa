name: Aprovar carrosséis ao revisar o PR
on:
  pull_request_review:
    types: [submitted]
jobs:
  aprovar:
    if: github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    permissions: {contents: write, pull-requests: write}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.event.pull_request.head.ref }}'}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node src/aprovar-pr.mjs
      - run: |
          git config user.name bot
          git config user.email bot@synapsa
          git add output
          git diff --cached --quiet || git commit -m "aprovado via review do PR #${{ github.event.pull_request.number }}"
          git push
      - run: gh pr merge ${{ github.event.pull_request.number }} --squash --delete-branch
        env: {GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
