name: Gerar carrosséis da semana
on:
  schedule: [{cron: '0 11 * * 1'}]   # segunda 08:00 BRT
  workflow_dispatch:
jobs:
  gerar:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm ci && npx playwright install --with-deps chromium && npm i -g @anthropic-ai/claude-code
      - run: node src/run-week.mjs
        env: {CLAUDE_CODE_OAUTH_TOKEN: '${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}', CLAUDE_MODEL: '${{ vars.CLAUDE_MODEL }}'}
      - run: |
          git config user.name bot && git config user.email bot@synapsa
          git add output state/historico.json
          git diff --cached --quiet || git commit -m "carrosséis da semana ($(date +%F))"
          git push
      - run: node src/notificar.mjs
        env:
          RESEND_API_KEY: '${{ secrets.RESEND_API_KEY }}'
          RESEND_FROM: '${{ vars.RESEND_FROM }}'
          APROVAR_PARA: '${{ vars.APROVAR_PARA }}'
          APPROVAL_SECRET: '${{ secrets.APPROVAL_SECRET }}'
          APPROVAL_WORKER_URL: '${{ vars.APPROVAL_WORKER_URL }}'
          PUBLIC_BASE_URL: '${{ vars.PUBLIC_BASE_URL }}'
      - run: |
          git add output
          git diff --cached --quiet || git commit -m "marcar itens notificados por email"
          git push
